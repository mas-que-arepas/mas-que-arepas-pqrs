<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administración | Más'Que Arepas</title><link rel="stylesheet" href="style.css"></head>
<body><header class="top"><div class="brand">🫓 <span>Más'Que Arepas · Admin</span></div><a href="index.html" class="admin-link">Volver</a></header>
<main><section class="panel" id="loginPanel"><h1>Panel de administración</h1><p class="muted">Ingresa el código de acceso.</p><input id="password" type="password" placeholder="Contraseña"><button class="btn primary" onclick="login()">Entrar</button><p id="loginMsg" class="error"></p></section>
<section class="panel hidden" id="dashboard"><div class="dash-head"><div><h1>Gestión de PQRS</h1><p class="muted">Panel local de demostración.</p></div><button class="btn secondary" onclick="logout()">Cerrar sesión</button></div><div class="stats"><div><b id="total">0</b><span>Total</span></div><div><b id="open">0</b><span>En proceso</span></div><div><b id="closed">0</b><span>Cerradas</span></div></div><div id="tableWrap"></div></section></main><footer>Más'Que Arepas · Administración</footer><script src="admin.js"></script></body></html>
